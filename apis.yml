aid: tt-labs
name: TT Labs
description: >-
  TT Labs is the company behind VideoPixie, a freelance marketplace that
  connects clients with professional video creators — videographers, video
  editors, directors, animators, and motion designers — available for hire.
  Clients post a project brief in about five minutes and receive competitive
  bids from vetted creators, then choose a creator based on portfolio and
  price. VideoPixie serves crowdfunding and Kickstarter videos, product and
  explainer videos, game trailers, wedding videography, screencasts, and full
  production campaigns, with example budgets ranging from a few hundred to
  tens of thousands of dollars. Backed by 500 Global, VideoPixie is a
  customer-facing marketplace web application (AngularJS) and does not publish
  a public developer API, developer portal, or client SDKs.
